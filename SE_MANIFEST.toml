# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-schema"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-manifest-schema/main/manifest-schema.toml"

# === Framework Context ===

[meta]
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
purpose = "Declares this repository's role in the Structural Explainability ecosystem."

# === Repository Identity ===

[repo]
name   = "IdentityRegimes"
org    = "structural-explainability"
class = "theory"
kind = "formalization"
status = "reference"
since  = "2025"
summary = "Lean formalization of the identity regimes for neutral substrates."

# === Layer Position ===

[layer]
space = "structural-explainability"
role  = "theory"

# === Dependency Declarations ===

[depends]
required = [
  { repo = "spec-se", kind = "semantic", version = "v1" }
]
optional = []

# === Provided Artifacts ===

[provides]
artifacts = [
  "ANNOTATIONS.md",
  "CITATION.cff",
  "README.md",
  "SE_MANIFEST.toml"
]

# === Scope ===

[scope]
includes = [
  "six identity-and-persistence regimes",
  "regime-forcing requirements (R1-R6)",
  "necessity lower bound (>= 6)",
  "sufficiency witness (a 6-regime model)",
  "axioms bounding domain applicability"
]
excludes = [
  "causal or normative primitives",
  "governance or enforcement logic",
  "domain semantics",
  "application schemas",
  "evolution semantics"
]


[citation]
cff = "CITATION.cff"
preferred = "repo"

[traceability]
identifier_map = "none"
