# ============================================================
# lakefile.toml
# ============================================================
# Declares the public Lean package identity, import surface,
# build targets, dependencies, and verification executables.

# ============================================================
# PROJECT IDENTITY
# ============================================================

name = "IdentityRegimes"
version = "0.1.0"
license = "MIT"

keywords = [
  "structural-explainability",
  "accountability",
  "identity-regimes",
  "formal-specification",
  "formal-verification",
  "proof-carrying",
  "theorem-proving",
  "lean4",
]

# ============================================================
# OPTIONAL DEPENDENCIES (custom per package)
# ============================================================

# CUSTOM.DEPENDENCIES
#   External Lean packages required by this formalization.

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.26.0"

# ============================================================
# BUILD SURFACE
# ============================================================
# defaultTargets must include the public Lean library root.

defaultTargets = ["IdentityRegimes"]

# ============================================================
# PUBLIC LIBRARY
# ============================================================
# Downstream Lean projects import this library root.
# Lake discovers modules under the matching source directory.

[[lean_lib]]
name = "IdentityRegimes"

# ============================================================
# EXECUTABLES
# ============================================================
# Export executables generate machine-readable contract artifacts.

[[lean_exe]]
name = "verify"
root = "Main"
